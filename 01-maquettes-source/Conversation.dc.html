<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Messages — Discussion avec le Jogger</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.scroll>*{flex-shrink:0}
a{color:#1B1714;text-decoration:none}a:hover{color:#C04E2A}
button,input{font-family:inherit}
.hs{scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FCF4EE; font-family: Inter, system-ui, sans-serif; color: #1B1714; display: flex; flex-direction: column; overflow: hidden">

  <div style="background: #FFFFFF; border-bottom: 1px solid #EADDD1; padding: 48px 12px 10px; display: flex; align-items: center; gap: 10px">
    <a href="Messages.dc.html" aria-label="Retour aux messages" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>
    <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: #1B1714; color: #FFFFFF; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center">J</span>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
      <b style="font-size: 15px">[Prénom du Jogger]</b>
      <span style="font-size: 12px; color: #2F7A55; font-weight: 600">Déménagement · lun. 2 nov.</span>
    </div>
    <a href="#" aria-label="Appeler le Jogger" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid #DCCBBB; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1"/></svg>
    </a>
  </div>

  <a href="DetailAcceptee.dc.html" style="margin: 10px 16px 0; background: #EEF7F1; border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; font-size: 13px">
    <span style="width: 8px; height: 8px; border-radius: 4px; background: #2F7A55; flex-shrink: 0"></span>
    <span style="flex: 1"><b>Acceptée</b> · Courbevoie → Paris 17e · 08:00</span>
    <span style="font-weight: 600; color: #1F5C3E">Voir</span>
  </a>

  <div class="scroll" style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="align-self: center; font-size: 12px; color: #6E625A; background: #F0E6DC; border-radius: 999px; padding: 4px 10px">Demande acceptée · ven. 16 oct.</div>
    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; align-items: {{m.align}}; gap: 3px">
        <div style="max-width: 78%; padding: 10px 13px; border-radius: {{m.radius}}; background: {{m.bg}}; color: {{m.color}}; font-size: 14px; line-height: 1.4; border: {{m.border}}">{{m.text}}</div>
        <span style="font-size: 11px; color: #6E625A; padding: 0 4px">{{m.time}}</span>
      </div>
    </sc-for>
  </div>

  <div class="hs" style="display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 8px">
    <sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
      <button onClick="{{q.send}}" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #DCCBBB; background: #FFFFFF; color: #1B1714; font-size: 13px; font-weight: 500; cursor: pointer">{{q.text}}</button>
    </sc-for>
  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #EADDD1; padding: 10px 12px 26px; display: flex; align-items: center; gap: 8px">
    <button aria-label="Joindre une photo" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 0; background: #F5ECE3; color: #5E534B; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </button>
    <input aria-label="Votre message" placeholder="Écrire un message…" value="{{draft}}" onChange="{{type}}" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #DCCBBB; background: #FCF8F4; padding: 0 16px; font-size: 15px; color: #1B1714; outline: 0">
    <button aria-label="Envoyer" onClick="{{send}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 0; background: #C04E2A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 20l18-8L3 4l2 7 9 1-9 1z"/></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      draft: '',
      msgs: [
        { me: false, text: 'Bonjour, je suis votre Jogger pour le déménagement de lundi. Y a-t-il un ascenseur à l’arrivée ?', time: '10:30' },
        { me: true, text: 'Bonjour ! Oui, et la place de stationnement est réservée devant l’immeuble.', time: '10:36' },
        { me: false, text: 'Parfait, je serai là à 8 h devant l’immeuble.', time: '10:42' }
      ]
    };
  }
  renderVals() {
    var self = this, st = this.state;
    var push = function (text) {
      if (!text || !text.trim()) return;
      var d = new Date();
      var t = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
      self.setState({ msgs: st.msgs.concat([{ me: true, text: text.trim(), time: t }]), draft: '' });
    };
    return {
      draft: st.draft,
      type: function (e) { self.setState({ draft: e.target.value }); },
      send: function () { push(st.draft); },
      quick: ['Merci !', 'Je suis sur place', 'J’ai un peu de retard'].map(function (q) { return { text: q, send: function () { push(q); } }; }),
      msgs: st.msgs.map(function (m) {
        return {
          text: m.text, time: m.time,
          align: m.me ? 'flex-end' : 'flex-start',
          bg: m.me ? '#C04E2A' : '#FFFFFF',
          color: m.me ? '#FFFFFF' : '#1B1714',
          border: m.me ? '0' : '1px solid #E6D8CB',
          radius: m.me ? '18px 18px 4px 18px' : '18px 18px 18px 4px'
        };
      })
    };
  }
}
</script>
</body>
</html>
