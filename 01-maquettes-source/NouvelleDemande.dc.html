<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Jojo — Nouvelle demande</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.scroll>*{flex-shrink:0}
a{color:#1B1714;text-decoration:none}a:hover{color:#C04E2A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FCF4EE; font-family: Inter, system-ui, sans-serif; color: #1B1714; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 48px 12px 0; display: flex; align-items: center; justify-content: space-between">
    <div style="width: 44px; height: 44px"></div>
    <div style="font-weight: 700; font-size: 16px">Nouvelle demande</div>
    <a href="Main.dc.html" aria-label="Fermer" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #DCCBBB; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
  </div>

  <div class="scroll" style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-weight: 700; font-size: 22px; letter-spacing: -0.01em">De quel service avez-vous besoin ?</h1>
      <p style="margin: 0; font-size: 14px; color: #6E625A">Choisissez un service pour commencer votre demande.</p>
    </div>

    <div role="radiogroup" aria-label="Services" style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{services}}" as="s" hint-placeholder-count="5">
        <button role="radio" aria-checked="{{s.checked}}" onClick="{{s.pick}}" style="text-align: left; display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; border: {{s.border}}; background: {{s.bg}}; color: #1B1714; cursor: pointer">
          <span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; background: {{s.iconBg}}; color: {{s.iconColor}}; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{s.isTransport}}" hint-placeholder-val="{{true}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/><path d="M3 13a2 2 0 0 1 4 0v1h10v-1a2 2 0 0 1 4 0v4H3z"/><path d="M5 17v2M19 17v2"/></svg></sc-if>
            <sc-if value="{{s.isDem}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h12v10H2z"/><path d="M14 9h4l3 3v4h-7"/><circle cx="6" cy="17.5" r="2"/><circle cx="17" cy="17.5" r="2"/></svg></sc-if>
            <sc-if value="{{s.isBras}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="4.5" r="2"/><path d="M5 21v-6l-1.5-4L7 8l3 3h3"/><path d="M9 21v-5"/><rect x="13" y="8" width="8" height="7" rx="1"/></svg></sc-if>
            <sc-if value="{{s.isGroup}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="12" width="8" height="8" rx="1"/><rect x="13" y="12" width="8" height="8" rx="1"/><rect x="8" y="3" width="8" height="8" rx="1"/></svg></sc-if>
            <sc-if value="{{s.isTow}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 16v-4l2-4h7l2 4v4z"/><circle cx="5.5" cy="17" r="1.6"/><circle cx="10.5" cy="17" r="1.6"/><path d="M13 12l6-7v9"/><path d="M19 14v1.5a1.5 1.5 0 1 1-1.5 1.5"/></svg></sc-if>
          </span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <span style="font-weight: 700; font-size: 16px">{{s.name}}</span>
            <span style="font-size: 13px; line-height: 1.35; color: #6E625A">{{s.desc}}</span>
          </span>
          <span aria-hidden="true" style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 11px; border: {{s.ring}}; box-sizing: border-box; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{s.dot}}"></span></span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #EADDD1; padding: 12px 20px 28px">
    <sc-if value="{{hasPick}}" hint-placeholder-val="{{true}}">
      <a href="{{nextHref}}" style="height: 54px; border-radius: 27px; background: #C04E2A; color: #FFFFFF; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px">{{cta}}
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </sc-if>
    <sc-if value="{{noPick}}" hint-placeholder-val="{{false}}">
      <button disabled style="width: 100%; height: 54px; border-radius: 27px; border: 0; background: #E8DDD3; color: #6E625A; font-weight: 700; font-size: 16px">Choisissez un service</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 'transport' };
  }
  renderVals() {
    var self = this, pick = this.state.pick;
    var list = [
      { id: 'transport', name: 'Transport', desc: 'Un meuble, un objet, quelques cartons', href: 'Adresses.dc.html' },
      { id: 'dem', name: 'Déménagement', desc: 'Un logement entier, camion et Joggers', href: 'DemAdresses.dc.html' },
      { id: 'bras', name: 'Gros bras', desc: 'Des bras pour porter, sans camion', href: 'GBMission.dc.html' },
      { id: 'group', name: 'Groupage', desc: 'Votre envoi sur un trajet partagé', href: 'Adresses.dc.html' },
      { id: 'tow', name: 'Remorquage', desc: 'Un véhicule en panne à déplacer', href: 'Adresses.dc.html' }
    ];
    var chosen = null;
    var services = list.map(function (s) {
      var on = s.id === pick;
      if (on) chosen = s;
      return {
        name: s.name, desc: s.desc, checked: on ? 'true' : 'false',
        isTransport: s.id === 'transport', isDem: s.id === 'dem', isBras: s.id === 'bras', isGroup: s.id === 'group', isTow: s.id === 'tow',
        border: on ? '1.5px solid #C04E2A' : '1px solid #E6D8CB',
        bg: on ? '#FBEDE7' : '#FFFFFF',
        iconBg: on ? '#C04E2A' : '#F5ECE3',
        iconColor: on ? '#FFFFFF' : '#C04E2A',
        ring: on ? '2px solid #C04E2A' : '2px solid #CDBFB2',
        dot: on ? '#C04E2A' : 'transparent',
        pick: function () { self.setState({ pick: s.id }); }
      };
    });
    return {
      services: services,
      hasPick: !!chosen,
      noPick: !chosen,
      nextHref: chosen ? chosen.href : 'NouvelleDemande.dc.html',
      cta: chosen ? 'Continuer avec ' + chosen.name : ''
    };
  }
}
</script>
</body>
</html>
